<!DOCTYPE html>
<html lang="it">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="../public/css/ChartsStyle.css">
    <link rel="stylesheet" href="../public/css/personalStyle.css">
    <link rel="stylesheet" href="../public/css/userstudy.css">
    <link rel="stylesheet" href="../public/css/userstudyPersonalStyle.css">
</head>

<body>
    <div class="container-custom">
        <div class="card-custom">
            <!-- Progress Bar -->
            <div class="progress-bar-container">
                <div class="step-progress">Passo 4 / 7</div>
                <div class="progress">
                    <div class="progress-bar progress-bar--57-1"></div>
                </div>
            </div>
            
            <h2 class="section-title">
                Quali sono le tue preferenze?
            </h2>
            
            <p class="section-description">
                Seleziona le tue preferenze di viaggio e di servizi che ritieni importanti.
            </p>
            
            <!-- Settings Section -->
            <div class="settings-section">
                <div class="setting-group">
                    <div class="setting-label"><i class="bi bi-clock me-2"></i> Tempo di Viaggio</div>
                    <select class="form-select" id="travel-time" required>
                        <option value="">Seleziona il tempo</option>
                        <option value="5">5 minuti</option>
                        <option value="10">10 minuti</option>
                        <option value="15" selected>15 minuti</option>
                        <option value="20">20 minuti</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <div class="setting-label"><i class="bi bi-person-walking me-2"></i> Modalità di Viaggio</div>
                    <div class="btn-group w-100 travel-mode-selector" role="group">

                        


                        <input type="radio" class="btn-check" name="travel-mode" id="mode-slow-walk" value="slow_walk">
                        <label class="btn btn-outline-primary" for="mode-slow-walk">
                            <i class="fa-solid fa-person-cane"></i>
                            <i class="fa-solid fa-baby-carriage"></i>
                            <i class="fa-solid fa-wheelchair"></i>
                            Passo lento
                        </label>

                        <input type="radio" class="btn-check" name="travel-mode" id="mode-walk" value="walk" checked>
                        <label class="btn btn-outline-primary" for="mode-walk">
                            <i class="bi bi-person-walking"></i> Passo normale
                        </label>

                        <input type="radio" class="btn-check" name="travel-mode" id="mode-bike" value="bike">
                        <label class="btn btn-outline-primary" for="mode-bike">
                            <i class="bi bi-bicycle"></i> Bicicletta / monopattino
                        </label>

                    </div>
                </div>
            </div>
            
            <!-- Categories Section -->
            <div>
                <div class="setting-label"><i class="bi bi-tags me-2"></i> Categorie di servizi</div>
                <!-- <p class="section-description">
                    Seleziona le categorie di servizi che desideri visualizzare sulla mappa.
                </p> -->
                
                <div class="categories-container" id="categories-container">
                    <!-- Populated by JavaScript -->
                </div>
            </div>
            
            <!-- Selected Categories -->
            <div class="selected-categories" id="selected-categories">
                <strong>Categorie selezionate:</strong>
                <div id="selected-badges" class="userstudy-selected-badges"></div>
            </div>
            
            <div class="error-message" id="error-message"></div>
            
            <!-- Buttons -->
            <div class="button-group">
                <button type="button" class="btn btn-primary-custom btn-nav" id="btn-next" disabled>
                    Avanti <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../public/js/config/categoryLabels.js"></script>
    <script src="../public/js/userstudy_personal.js"></script>
</body>
</html>
