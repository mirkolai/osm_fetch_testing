    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../public/css/userstudy.css">
    <link rel="stylesheet" href="../public/css/userstudySearchStyle.css">
</head>

<body>



<!-- Search Panel -->
<div class="search-panel">
    <!-- <h5>Seleziona l'indirizzo del luogo in cui vivi</h5>-->
    <!-- Progress Indicator -->
    <div class="progress-bar-container">
        <div class="step-progress">Passo 3 / 7</div>
        <div class="progress">
            <div class="progress-bar progress-bar--42-8"></div>
        </div>
    </div>
    <div class="search-input-group">
        <label for="city-search">Seleziona l'indirizzo del luogo in cui vivi:    
            <i class="bi bi-info-circle text-secondary"
            data-bs-toggle="tooltip"
            data-bs-placement="right"
            title="La ricerca è disponibile solo per le città evidenziate sulla mappa con un contorno bianco.">
            </i>
        </label>
        <input 
            type="text" 
            id="city-search" 
            placeholder="Es: Via Roma, Torino"
            autocomplete="off"
        >
        
        <div id="suggestions" class="list-group"></div>
    </div>

    <div class="selected-street" id="selected-street-info">
        <p><strong>Via selezionata:</strong> <span id="street-name"></span></p>
        <p><strong>Coordinate:</strong> <span id="street-coords"></span></p>
    </div>

    <div class="error-message" id="error-message"></div>

    <button class="btn-view-analysis" id="btn-view-analysis">
        <i class="bi bi-graph-up me-2"></i>Vedi Analisi
    </button>

    <div class="loading-spinner" id="loading-spinner">
        <div class="spinner"></div>
        <p class="userstudy-loading-message">Analizzando l'area...</p>
    </div>

    <div class="button-group">
        <button class="btn-analyze" id="btn-analyze" disabled>
            <i class="bi bi-binoculars me-2"></i>Analizza
        </button>
        <button class="btn-next" id="btn-next" disabled>
            Avanti <i class="bi bi-arrow-right ms-2"></i>
        </button>
    </div>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Modal for Spider Chart -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal-content-box">
        <button class="modal-close" id="modal-close">&times;</button>
            <!-- <h4 class="modal-title">Analisi senza personalizzazione</h4>-->
           <!-- <p class="modal-description">
            Questa analisi valuta il livello di prossimità urbana dell'area considerando la distribuzione attuale dei servizi,
            senza applicare preferenze o pesi personalizzati 
            <i class="bi bi-info-circle text-secondary"
            data-bs-toggle="tooltip"
            data-bs-placement="right"
            title="Le misure di accessibilità ai servizi vengono generalmente calcolate considerando un utente standard. Questo approccio consente un confronto omogeneo, ma può non rappresentare le esigenze specifiche e le preferenze individuali di ogni persona.">
            </i>. -->
            Qui mostriamo la facilità di accesso ai servizi essenziali vicini a casa tua e la qualità dei collegamenti con il resto della città in riferimento alla media cittadina. 
        
        </p>
            <div id="spider-chart-modal"></div>
            <div id="gauge-chart-modal" class="gauge-chart"></div>
   
</div>
